# PROPOSED expanded-dataset matrix (Milestone 9). DESIGN ONLY: approved_for_generation is false;
# no runner reads this file. Regenerate with: .venv/bin/python scripts/m9_design.py --write
matrix: m9_expanded_matrix_proposed
status: PROPOSED - design only; not consumed by any generation runner
approved_for_generation: false
design: B (balanced, reduced factorial)
baseline_dependency:
  dataset_version: fleetcan-sim-1.1
  sessions: 610
  fleet_sizes:
  - 2
  - 5
  - 10
  status: immutable; reused unchanged, never regenerated
proposed_component_dataset_version: fleetcan-sim-scale-1.0 (proposal; adopt only after approval)
proposed_umbrella_release: fleetcan-sim-2.0 = fleetcan-sim-1.1 (unchanged, by hash) + fleetcan-sim-scale-1.0 (proposal; NOT adopted)
generator:
  version: 1.3.0
  schema_version: '1.0'
  descriptor_version: '1.0'
  route_generation: grid_loops_v1 (generator 1.2.0)
  fleet_configs: config/m8/fleets/fleet_{20,50,100}.yaml (frozen settings, vehicle_{n:03d})
frozen_semantics:
  attack_parameters:
    flooding:
      can_id: 0
      rate_hz: 1600
      dlc: 8
      payload: zeros
    fuzzy:
      mode: both
      rate_hz: 1000
      id_range:
      - 0
      - 2047
      dlc: random
    malfunction:
      mode: inject
      target: vehicle_speed
      manipulation:
        strategy: constant
        value: 250.0
      rate_hz: 100
    replay:
      window_relative_s: '[-attack_s, 0.0]'
      source_vehicle: self
      time_offset_ms: 0.25
  attack_duration_s: 5.0
  partial_overlap_attack_duration_s: 10.0
  warmup_s: 10.0
  tail_s: 5.0
  S0_duration_s: 40.0
  S1_duration_s: 20.0
temporal_patterns:
  simultaneous: all members start at campaign_start (frozen)
  small: member i starts at campaign_start + 0.5 s * i (frozen sequential semantics, scripts/m6_build_matrix.py)
  medium: member i at + 2 s * i (frozen)
  large: member i at + 10 s * i (frozen)
  partial: 'member i at + 5 s * i with 10 s attacks: adjacent members overlap 5 s (50 %) (frozen)'
  probe: replay, K = 2, delays [0, 0.1] s (frozen)
  bounded_spread_2s: 'NEW: member i at + 2 s * i / (K - 1); total spread 2 s for any K'
  bounded_spread_10s: 'NEW: member i at + 10 s * i / (K - 1); total spread 10 s for any K'
  S2 near_simultaneous: independent attack j starts at 10 + 0.5 s * j / (k - 1) (frozen baseline S2)
  S2 staggered_0.5s: 'NEW: independent attack j starts at 10 + 0.5 s * j (timing identical to coordinated ''small'')'
  S2 separated_10s: 'NEW: independent attack j starts at 10 + 10 s * j (timing identical to coordinated ''large''; no overlap)'
  bounded_spread_0p5s: 'NEW: member i at + 0.5 s * i / (K - 1); total spread 0.5 s for any K'
  mixed: coordinated 'small' + m independent same-family attacks at 10.25 + 0.5 s * j (frozen baseline mixed)
member_selection:
  rule: profile-stratified proportional quotas (largest remainder, seeded tie break), seeded choice within each profile, seeded permutation =
    delay rank
  streams:
    coordinated: derive_seed(seed, 'campaign_members/C_MAIN')
    independent (S2, mixed): derive_seed(seed, 'independent_targets')
    isolated (S1): derive_seed(seed, 'isolated_target')
  inputs: experiment seed + frozen fleet profile assignment only; no detector information
  implementation_note: resolved by the matrix builder into explicit campaign targets; generator semantics unchanged
seeds:
  strategy: seed = 920000 + 10 * config_index + repetition (repetition 1..5)
  derived_streams: 'SUMO = seed; profile assignment, switch-on, ECU jitter, route generation, attacks, campaigns: existing derive_seed tags (unchanged);
    member selection: new tags above'
session_id: <config_id>_R<repetition>; config_id starts with FCS10_ (baseline uses FC11_)
cost_model:
  benign_frames_per_vehicle_s: 320.0
  attack_frames_per_member:
    flooding: 1600
    fuzzy: 1000
    malfunction: 100
    replay: 324
  gen_s_fixed: 2.5
  gen_us_per_frame: 127.0
  analysis_s_fixed: 0.5
  analysis_us_per_frame: 17.5
  mb_per_mframe: 52.0
  replay_extra_mb_per_mframe: 55.0
  descriptors_per_frame: 0.0199
