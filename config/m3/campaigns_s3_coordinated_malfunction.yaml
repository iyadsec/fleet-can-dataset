# Milestone 3 campaign file. Membership is defined here only (never inferred from timing).
# Times are logical SUMO seconds. Schema: src/campaign_scheduler.py
# coordinated malfunction: injected VehicleSpeed = 250 km/h, delays 0/2/4 s
campaigns:
  - campaign_id: C007
    attack_type: malfunction
    coordinated: true
    targets: [vehicle_01, vehicle_02, vehicle_03]
    start_s: 10.0
    delay_pattern: fixed
    relative_delays_s: [0.0, 2.0, 4.0]
    duration_s: 5.0
    params: {mode: inject, message: VEHICLE_SPEED, signal: VehicleSpeed, manipulation: {strategy: constant, value: 250.0}, rate_hz: 100, phase_ms: 0.5}
