# Milestone 3 campaign file. Membership is defined here only (never inferred from timing).
# Times are logical SUMO seconds. Schema: src/campaign_scheduler.py
# coordinated replay, 10 s attacks at 10-20, 15-25, 18-28 s (partial overlap)
campaigns:
  - campaign_id: C004
    attack_type: replay
    coordinated: true
    targets: [vehicle_01, vehicle_02, vehicle_03]
    start_s: 10.0
    delay_pattern: fixed
    relative_delays_s: [0.0, 5.0, 8.0]
    params: {window_relative_s: [-10.0, 0.0], source_vehicle: self, time_offset_ms: 0.25, can_ids: all}
