# Milestone 3 campaign file. Membership is defined here only (never inferred from timing).
# Times are logical SUMO seconds. Schema: src/campaign_scheduler.py
# coordinated replay, seeded uniform random delays in [0, 3] s (1 ms resolution)
campaigns:
  - campaign_id: C008
    attack_type: replay
    coordinated: true
    targets: [vehicle_01, vehicle_02, vehicle_03]
    start_s: 10.0
    delay_pattern: uniform_random
    delay_range_s: [0.0, 3.0]
    delay_resolution_s: 0.001
    params: {window_relative_s: [-5.0, 0.0], source_vehicle: self, time_offset_ms: 0.25, can_ids: all}
