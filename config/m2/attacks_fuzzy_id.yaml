# Milestone 2, single-vehicle attack run 'fuzzy_id' (vehicle_01 only, no campaigns).
# Fuzzy vehicle_01: random CAN IDs, fixed zero payload
# Times on the SUMO timeline (s). Window = [start_s, start_s + duration_s).
attacks:
  - attack_id: A_FUZZY_ID
    type: fuzzy
    vehicle: vehicle_01
    start_s: 10.0
    duration_s: 5.0
    params:
      mode: id
      rate_hz: 1000
      id_range: [0x000, 0x7FF]
      dlc: 8
      payload: zeros
