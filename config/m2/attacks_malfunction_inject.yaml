# Milestone 2, single-vehicle attack run 'malfunction_inject' (vehicle_01 only, no campaigns).
# Malfunction vehicle_01: attacker injects VEHICLE_SPEED with VehicleSpeed = 250 km/h
# Times on the SUMO timeline (s). Window = [start_s, start_s + duration_s).
attacks:
  - attack_id: A_MALFUNCTION_INJECT
    type: malfunction
    vehicle: vehicle_01
    start_s: 10.0
    duration_s: 5.0
    params:
      mode: inject
      message: VEHICLE_SPEED
      signal: VehicleSpeed
      manipulation: {strategy: constant, value: 250.0}
      rate_hz: 100
      phase_ms: 0.5
