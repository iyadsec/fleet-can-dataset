# Milestone 8 scalability test (engineering only; not part of any research dataset).
experiment:
  experiment_id: M8_S0_N020
  dataset_version: m8-scalability-test
  scenario_id: S0
  description: "M8 benign benchmark, 20 vehicles"
  seed: 80020
  tags: {milestone: M8, fleet_size: 20, attack: none, campaign_size: 0, pattern: none}
simulation:
  route_generation: {method: grid_loops_v1, network: sumo/network/grid4x4.net.xml}
  step_length_s: 0.01
  duration_s: 40.0
  realtime: false
can:
  transport: socketcan
  bus_model: logical
  frame_format: classical
  capture_drain_s: 0.5
output:
  root: data
storage:
  format: parquet
fleet_config: config/m8/fleets/fleet_20.yaml
attacks_config: config/attacks.yaml
campaigns_config: config/campaigns.yaml
