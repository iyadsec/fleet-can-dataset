# FROZEN final-protocol fleet (generator 1.1.0): 2 vehicles.
# Profiles A/B/C: seeded balanced_shuffle (N < 3: seeded subset without replacement).
# ECU switch-on: seeded uniform [0, 1.0] s (Milestone 5 phase sensitivity).
# ECU release jitter: seeded uniform +-1 % of each message period (Milestone 5.1 jitter sensitivity).
profiles_file: config/profiles/profiles_abc.yaml
fleet:
  channel_pattern: "vcan{index}"
  count: 2
  id_pattern: "vehicle_{n:02d}"
  profile_assignment: {strategy: balanced_shuffle, profiles: [profile_A, profile_B, profile_C]}
  switch_on: {range_s: [0.0, 1.0], resolution_s: 0.000001}
  ecu_jitter: {fraction: 0.01}
