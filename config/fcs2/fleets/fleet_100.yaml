# fleetcan-sim-2.0 fleet of 100 vehicles: profiles A-H balanced (seeded shuffle), ECU switch-on U[0,1] s,
# fleet-default release jitter 1 % (profiles D-H override it with their own jitter).
profiles_file: [config/profiles/profiles_abc.yaml, config/fcs2/profiles_d_h.yaml]
fleet:
  channel_pattern: "vcan{index}"
  count: 100
  id_pattern: "vehicle_{n:03d}"
  profile_assignment: {strategy: balanced_shuffle, profiles: [profile_A, profile_B, profile_C, profile_D, profile_E, profile_F, profile_G, profile_H]}
  switch_on: {range_s: [0.0, 1.0], resolution_s: 0.000001}
  ecu_jitter: {fraction: 0.01}
